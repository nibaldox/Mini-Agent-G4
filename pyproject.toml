[project]
name = "mini-agent-g4"
version = "0.1.0"
description = "Mini Agent G4 - Agno-based agent with file, search and shell tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.0.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "ddgs>=3.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "mcp>=1.0.0",
    "requests>=2.33.1",
    "textual>=8.2.3",
    "croniter>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]

[project.scripts]
mini-agent = "mini_agent.__main__:main"
mini-agent-tui = "mini_agent.tui.__main__:run_tui"
